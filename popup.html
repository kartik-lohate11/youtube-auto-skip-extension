<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Auto Skip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow" id="ambientGlow"></div>

    <div class="content-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="logo-badge">
                    <svg viewBox="0 0 24 24">
                        <!-- Fast-Forward / Skip Path -->
                        <polygon points="4,5 13,12 4,19" />
                        <polygon points="12,5 21,12 12,19" />
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Auto Skip</h1>
                    <span>YouTube Ad Eliminator</span>
                </div>
            </div>
            <div class="version-pill">v1.1</div>
        </header>

        <!-- Status Card with Master Switch -->
        <div class="status-card" id="statusCard">
            <div class="status-info">
                <div class="status-dot" id="statusDot"></div>
                <div>
                    <div class="status-label" id="statusLabel">Active</div>
                    <div class="status-sub" id="statusSub">Skipping detected ads</div>
                </div>
            </div>
            <label class="switch" title="Toggle Auto-Skip">
                <input type="checkbox" id="masterToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <!-- Options Group -->
        <div class="options-group">
            <div class="option-item">
                <div class="option-desc">
                    <span class="option-title">Instant Fast-Forward</span>
                    <span class="option-hint">Skip unskippable & countdown ads</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="fastForwardToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="option-item">
                <div class="option-desc">
                    <span class="option-title">Silence Ad Audio</span>
                    <span class="option-hint">Mute volume while ads play</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="autoMuteToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Stats Card -->
        <div class="stats-card">
            <div class="stats-left">
                <span class="stats-title">Ads Blocked / Skipped</span>
                <div class="stats-count">
                    <span id="adsCount">0</span>
                    <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">ads</span>
                </div>
            </div>
            <button class="reset-stats-btn" id="resetStatsBtn" title="Reset Counter">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
            </button>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span>Enjoy uninterrupted streaming</span>
        </footer>
    </div>

    <!-- External Script (Manifest V3 CSP Compliant) -->
    <script src="popup.js"></script>
</body>
</html>
